[project]
name = "camille"
version = "0.1.0"
description = "An AI assistant"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Jonathan Tremesaygues", email = "jonathan.tremesaygues@slaanesh.org" },
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-auditlog>=3.4.1",
    "django-fernet-encrypted-fields>=0.4.0",
    "django-rls-tenants>=1.3.0",
    "psycopg[binary]>=3.3.5",
]

[project.scripts]
camille = "camille.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
]

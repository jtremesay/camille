[project]
name = "camille"
version = "0.1.0"
description = "An AI assistant"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Jonathan Tremesaygues", email = "jonathan.tremesaygues@slaanesh.org" },
]
requires-python = ">=3.14"
dependencies = ["django>=6.1.1"]

[project.scripts]
camille = "camille.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

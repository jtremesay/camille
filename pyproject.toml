[project]
name = "camille"
version = "6.0.0"
description = "An AI assistant for Mattermost"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "daphne",
    "dj-database-url",
    "django",
    "django-fernet-encrypted-fields",
    "httpx-ws",
    "httpx[brotli,http2,zstd]",
    "logfire[httpx]",
    "psycopg[binary]",
    "pydantic-ai-slim[anthropic,bedrock,duckduckgo,google,mistral,openrouter,retries,web-fetch]",
    "python-dotenv",
    "servestatic[brotli]",
    "tzdata",
]

[project.scripts]
camille = "camille.manage:main"

[dependency-groups]
dev = ["ipython", "pre-commit"]

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

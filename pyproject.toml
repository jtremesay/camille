[project]
name = "camille"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jonathan Tremesaygues", email = "jonathan.tremesaygues@slaanesh.org" },
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-fernet-encrypted-fields>=0.4.0",
    "django-polymorphic>=4.11.7",
    "pydantic-ai-slim>=2.56.0",
]

[project.scripts]
camille = "camille.manage:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.7.0"]

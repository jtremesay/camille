[project]
name = "camille"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jonathan Tremesaygues", email = "jonathan.tremesaygues@slaanesh.org" },
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-extensions>=4.1",
    "django-fernet-encrypted-fields>=0.4.0",
    "django-polymorphic>=4.11.7",
    "pydantic-ai-slim[duckduckgo,google,logfire,openai,tavily,web-fetch]>=2.56.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
camille = "camille.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.7.0", "rust-just>=1.58.0"]
testing = ["coverage>=7.16.2"]

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/asgi.py",
    "*/wsgi.py",
]
